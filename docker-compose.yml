version: '3.8'

services:
  edgevision-api:
    build: .
    container_name: edgevision-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./yolov8n.onnx:/app/yolov8n.onnx
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  # Optional: Add Prometheus for Step 4 completeness
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana-oss:latest
    container_name: edgevision-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
